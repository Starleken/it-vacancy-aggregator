server:
  host: ${SERVER_HOST:localhost}
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: it-vacancy-aggregator
  liquibase:
    enabled: true
    change-log: classpath:db/master.xml
    liquibase-schema: ${DB_SCHEMA:vacancy_aggregator_schema}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: ${SHOW_SQL:false}
    properties.hibernate.format_sql: ${FORMAT_SQL:false}

management:
  endpoints:
    web:
      exposure:
        include: loggers
  endpoint:
    loggers:
      enabled: true
